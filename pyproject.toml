[project]
name = "personaplex-mlx"
version = "0.1.0"
description = "Real-time voice conversation AI on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "mcruz" }
]
keywords = ["mlx", "apple-silicon", "voice", "ai", "personaplex"]

dependencies = [
    "mlx>=0.21.0",
    "moshi-mlx>=0.2.2",
    "rustymimi>=0.2.2",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
personaplex = "live_server_mlx:main"
serve = "live_server_mlx:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
